<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>下屏 · DSH</title>
<style>
  :root{
    --bg:#101218; --card:#1b1f2a; --card2:#232837; --fg:#e8ecf4;
    --dim:#8b93a7; --accent:#5b8cff; --good:#35c46a; --warn:#f0b429; --bad:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:8px 12px;background:var(--card);border-bottom:1px solid #2a3040;
    display:flex;align-items:center;gap:10px;flex:none}
  header .t{font-size:13px;color:var(--dim)}
  header .pos{font-size:15px;font-weight:600}
  header .scene{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--dim)}
  main{flex:1;overflow-y:auto;padding:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border:1px solid #2a3040;border-radius:14px;
    padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;transition:transform .08s,background .15s}
  .card:active{transform:scale(.97);background:var(--card2)}
  .card .ico{font-size:26px}
  .card .name{font-size:14px;font-weight:600}
  .card .sub{font-size:11px;color:var(--dim)}
  .page{display:none}
  .page.active{display:block}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);
    font-size:14px;padding:6px 0 10px;cursor:pointer}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;
    background:var(--card);border-radius:10px}
  .row .nm{flex:1;font-size:14px}
  .row .lv{font-size:12px;color:var(--dim)}
  .hp{height:8px;border-radius:4px;background:#2a3040;overflow:hidden;width:84px}
  .hp>i{display:block;height:100%;background:var(--good)}
  .hp>i.warn{background:var(--warn)} .hp>i.bad{background:var(--bad)}
  .row .hpt{font-size:12px;color:var(--dim);width:58px;text-align:right}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:var(--card2);border:1px solid #303849;border-radius:12px;
    padding:14px 10px;font-size:15px;color:var(--fg);text-align:center;cursor:pointer}
  .btn:active{background:#2d3447}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:#3a1f24;border-color:#5a2a30;color:#ff8b8f}
  .muted{color:var(--dim);font-size:12px}
  .notice{padding:10px;border-radius:10px;background:var(--card);color:var(--warn);
    font-size:13px;margin-bottom:10px;display:none}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mv{background:var(--card);border-radius:10px;padding:10px}
  .mv .n{font-size:14px;font-weight:600}
  .mv .d{font-size:11px;color:var(--dim);margin-top:3px}
  .eff{font-size:11px;padding:1px 6px;border-radius:99px}
  .eff.up{background:#12341f;color:#6ee7a0}
  .eff.down{background:#34121a;color:#ff8b8f}
  .eff.eq{background:#22283a;color:var(--dim)}
  .dest{background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;cursor:pointer}
  .dest:active{background:var(--card2)}
  .dest .dn{flex:1;font-size:15px}
  .dest .dc{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="scene" id="scene">…</span>
    <span class="pos" id="pos">—</span>
    <span class="t" id="lead">—</span>
  </header>
  <main>
    <div class="notice" id="notice"></div>

    <!-- 主页 -->
    <div class="page active" id="page-home">
      <div class="grid">
        <div class="card" onclick="go('party')"><div class="ico">👥</div><div class="name">队伍</div><div class="sub">等级 · HP · 招式</div></div>
        <div class="card" onclick="go('battle')"><div class="ico">⚔️</div><div class="name">战斗</div><div class="sub">遇敌 · 自动 · 练级</div></div>
        <div class="card" onclick="go('panel')"><div class="ico">📋</div><div class="name">战斗面板</div><div class="sub">敌方 · 招式表</div></div>
        <div class="card" onclick="go('move')"><div class="ico">🚶</div><div class="name">移动</div><div class="sub">点地名自动走</div></div>
        <div class="card" onclick="go('setting')"><div class="ico">⚙️</div><div class="name">设置</div><div class="sub">刷新 · 服务</div></div>
      </div>
    </div>

    <!-- 队伍 -->
    <div class="page" id="page-party">
      <div class="back" onclick="go('home')">← 返回</div>
      <div id="party-list"></div>
    </div>

    <!-- 战斗（自动化） -->
    <div class="page" id="page-battle">
      <div class="back" onclick="go('home')">← 返回</div>
      <div class="btns">
        <div class="btn primary" onclick="act('encounter')">遇敌</div>
        <div class="btn" onclick="act('auto_battle')">自动战斗</div>
        <div class="btn" onclick="act('heal')">回中心治疗</div>
        <div class="btn" onclick="act('goto',{x:22,y:20})">去精灵中心</div>
      </div>
      <p class="muted" style="margin-top:12px">遇敌：在草地走动直到遇到野生宝可梦。自动战斗：遇敌后自动打到结束。</p>
    </div>

    <!-- 战斗面板 -->
    <div class="page" id="page-panel">
      <div class="back" onclick="go('home')">← 返回</div>
      <div id="panel-body"><p class="muted">当前不在战斗中。</p></div>
    </div>

    <!-- 移动 -->
    <div class="page" id="page-move">
      <div class="back" onclick="go('home')">← 返回</div>
      <div id="dest-list"></div>
    </div>

    <!-- 设置 -->
    <div class="page" id="page-setting">
      <div class="back" onclick="go('home')">← 返回</div>
      <div class="row"><span class="nm">刷新间隔</span>
        <select id="interval" onchange="setInterval2()" style="background:#232837;color:#e8ecf4;border:1px solid #303849;border-radius:8px;padding:6px">
          <option value="500">0.5 秒</option><option value="1000" selected>1 秒</option><option value="2000">2 秒</option>
        </select>
      </div>
      <div class="row"><span class="nm">服务状态</span><span class="lv" id="svc">检查中…</span></div>
      <p class="muted">地址 127.0.0.1:8080 · 数据来自 RetroArch 内存（UDP 55355）</p>
    </div>
  </main>
</div>
<script>
const DEST = [
  {name:"华蓝·精灵中心", map:"0x82df30c", x:22, y:20},
  {name:"华蓝·道馆", map:"0x82df30c", x:31, y:22},
  {name:"5号道路·草地", map:"0x82e833c", x:22, y:5},
  {name:"枯叶·精灵中心", map:"0x82e0614", x:15, y:8},
];
let st = null, timer = null, pollMs = 1000;

function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  if(page==='party') loadParty();
  if(page==='panel') renderPanel();
  if(page==='move') renderDest();
}

async function act(name, args){
  notice('执行中… ' + name);
  try{
    const r = await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, args})});
    const j = await r.json();
    if(!j.ok) notice(j.busy ? ('忙：' + j.busy) : ('失败：' + (j.error||'')));
    else notice('已开始：' + name);
  }catch(e){ notice('请求失败'); }
}

async function poll(){
  try{
    const r = await fetch('/api/state');
    st = await r.json();
    renderStatus();
    if(document.getElementById('page-panel').classList.contains('active')) renderPanel();
  }catch(e){
    document.getElementById('scene').textContent = '离线';
    document.getElementById('svc').textContent = '连接失败';
  }
}

function renderStatus(){
  const s = st;
  const sceneMap = {map:'地图', battle:'战斗', battle_dialog:'战斗', battle_intro:'开场', anim:'动画', choice:'选项', unknown:'未知'};
  document.getElementById('scene').textContent = sceneMap[s.scene] || s.scene;
  document.getElementById('pos').textContent = (s.x!==null) ? `(${s.x},${s.y})` : '—';
  const party = s.party || [];
  const lead = party[0];
  document.getElementById('lead').textContent = lead ? `Lv${lead.lv} ${lead.hp}/${lead.mhp}` : '';
  document.getElementById('svc').textContent = '正常';
}

function hpClass(hp, mhp){
  const r = hp/mhp;
  return r<=0.25 ? 'bad' : (r<=0.5 ? 'warn' : '');
}

function renderParty(){
  const el = document.getElementById('party-list');
  const party = (st && st.party) || [];
  if(!party.length){ el.innerHTML = '<p class="muted">读不到队伍</p>'; return; }
  el.innerHTML = party.map((m,i)=>`
    <div class="row">
      <span class="nm">#${i+1} ${speciesName(m.species)}</span>
      <span class="lv">Lv${m.lv}</span>
      <div class="hp"><i class="${hpClass(m.hp,m.mhp)}" style="width:${Math.max(2,100*m.hp/m.mhp)}%"></i></div>
      <span class="hpt">${m.hp}/${m.mhp}</span>
    </div>`).join('');
}

async function loadParty(){
  try{
    const r = await fetch('/api/party');
    const j = await r.json();
    const el = document.getElementById('party-list');
    const arr = j.party || [];
    if(!arr.length){ el.innerHTML = '<p class="muted">读不到队伍</p>'; return; }
    el.innerHTML = arr.map(m=>`
      <div class="row">
        <span class="nm">#${m.slot+1} ${speciesName(m.species)}</span>
        <span class="lv">Lv${m.lv}</span>
        <div class="hp"><i class="${hpClass(m.hp,m.mhp)}" style="width:${Math.max(2,100*m.hp/m.mhp)}%"></i></div>
        <span class="hpt">${m.hp}/${m.mhp}</span>
      </div>`).join('');
  }catch(e){}
}

function renderPanel(){
  const el = document.getElementById('panel-body');
  if(!st || !st.battle){ el.innerHTML = '<p class="muted">当前不在战斗中。</p>'; return; }
  const e = st.enemy || {}, me = st.me || {};
  let html = '';
  html += `<div class="row"><span class="nm">敌方 ${speciesName(e.species)}</span><span class="lv">Lv${e.lv}</span>
    <div class="hp"><i class="${hpClass(e.hp,e.mhp)}" style="width:${Math.max(2,100*e.hp/e.mhp)}%"></i></div>
    <span class="hpt">${e.hp}/${e.mhp}</span></div>`;
  if(st.suggest) html += `<p class="muted">建议：第 ${st.suggest.idx+1} 招 · ${st.suggest.why}</p>`;
  fetch('/api/moves').then(r=>r.json()).then(j=>{
    const mv = j.moves || [];
    if(!mv.length) return;
    el.innerHTML = html + '<div class="moves">' + mv.map(m=>{
      const cls = m.eff>1 ? 'up' : (m.eff<1 ? 'down' : 'eq');
      return `<div class="mv"><div class="n">${m.name}</div>
        <div class="d">${m.type} · 威力${m.power} · PP${m.pp}
        <span class="eff ${cls}">x${m.eff}</span></div></div>`;
    }).join('') + '</div>';
  });
  el.innerHTML = html + '<p class="muted">读取招式…</p>';
}

function renderDest(){
  const el = document.getElementById('dest-list');
  const curMap = st && st.map;
  el.innerHTML = DEST.map((d,i)=>{
    const here = d.map === curMap;
    return `<div class="dest" onclick="travel(${i})">
      <span class="dn">${d.name}</span>
      <span class="dc">${here ? '当前地图' : '跨地图'} (${d.x},${d.y})</span>
    </div>`;
  }).join('') + '<p class="muted">跨地图移动暂未自动串联，会提示。</p>';
}

function travel(i){
  const d = DEST[i];
  if(st && d.map && st.map && d.map !== st.map){
    notice('跨地图移动暂未实现（需要路线串联）');
    return;
  }
  act('goto', {x:d.x, y:d.y});
}

function notice(t){
  const el = document.getElementById('notice');
  el.textContent = t; el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, 3000);
}

function speciesName(id){
  const N = {25:'皮卡丘',15:'大针蜂',22:'大嘴雀',8:'卡咪龟',69:'喇叭芽',32:'尼多君',16:'波波',52:'喵喵'};
  return N[id] || ('No.' + id);
}

function setInterval2(){
  pollMs = parseInt(document.getElementById('interval').value, 10);
  clearInterval(timer);
  timer = setInterval(poll, pollMs);
}

poll();
timer = setInterval(poll, pollMs);
</script>
</body>
</html>
