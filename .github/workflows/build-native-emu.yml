name: build-apk

on:
  push:
    paths:
      - "native-emu/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发 Release 用仓库自带的 GITHUB_TOKEN，不需要 PAT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: clone mgba
        run: git clone --depth 1 https://github.com/mgba-emu/mgba.git native-emu/third_party/mgba
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # 签名密钥不进仓库：从 Actions secret 解码到工作区（每次构建都是临时的）
      - name: decode keystore
        working-directory: native-emu/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "缺少 secret ANDROID_KEYSTORE_B64，无法签名构建" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
      - name: build
        working-directory: native-emu
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: emu
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: native-emu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # 构建成功即发布，OTA 的更新源就是这里；失败不会走到这一步（避免再发旧包）
      - name: publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: build-${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: native-emu/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
