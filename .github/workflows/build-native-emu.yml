name: build-apk

on:
  push:
    paths:
      - "native-emu/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: clone mgba
        run: git clone --depth 1 https://github.com/mgba-emu/mgba.git native-emu/third_party/mgba
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: build
        working-directory: native-emu
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: native-emu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
